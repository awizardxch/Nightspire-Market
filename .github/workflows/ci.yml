name: ci

# Local-only test suites. No secrets, no public-chain access, no deployments.
# Every job runs against local simulators: anvil (EVM), bankrun (Solana),
# brun/clvm_tools (Chia), and the relay/worker/venue harnesses.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            contracts/solana/package-lock.json
            worker/package-lock.json

      - name: Install Foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contracts/chia/requirements.txt
            venue-api/requirements.txt

      - name: Install Python deps
        run: |
          pip install -r contracts/chia/requirements.txt \
                      -r venue-api/requirements.txt \
                      -r relay/test/requirements.txt

      - name: EVM — forge build + test
        working-directory: contracts/evm
        run: |
          forge build
          forge test

      - name: Chia — CLVM test suite
        run: python3 contracts/chia/run_tests.py

      - name: Solana — bankrun tests
        working-directory: contracts/solana
        run: |
          npm ci
          npm run test:bankrun
        # NOTE: tests run against the committed fixtures
        # target/deploy/{xcm_htlc,spl_token}.so and target/idl/xcm_htlc.json —
        # no Solana toolchain build needed. To rebuild the program binary,
        # see contracts/solana/README.md (cargo build-sbf).

      - name: Relay — smoke test
        working-directory: relay
        run: npm run smoke

      - name: Relay — EIP-712 signature tests
        working-directory: relay
        run: npm run test:eip712

      - name: Relay — venue view adapter tests
        working-directory: relay
        run: npm run test:venue_views

      - name: Relay — venue API contract test
        working-directory: relay
        run: npm run test:contract

      - name: Worker — demo + recovery drills
        working-directory: worker
        run: |
          npm ci
          npm run demo

      - name: Venue API — schema/example validation
        run: python3 venue-api/validate.py
